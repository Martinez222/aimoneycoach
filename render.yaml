services:
  - type: web
    name: aimoneycoach-app
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: AIMONEYCOACH_DATABASE_URL
        fromDatabase:
          name: aimoneycoach-db
          property: connectionString
      - key: AIMONEYCOACH_GROQ_API_KEY
        sync: false
      - key: AIMONEYCOACH_GROQ_MODEL
        value: mixtral-8x7b-32768
      - key: AIMONEYCOACH_JWT_SECRET_KEY
        generateValue: true
      - key: AIMONEYCOACH_JWT_ALGORITHM
        value: HS256
      - key: AIMONEYCOACH_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: AIMONEYCOACH_DEBUG
        value: "false"
      - key: AIMONEYCOACH_ENVIRONMENT
        value: production

databases:
  - name: aimoneycoach-db
    plan: free
    region: frankfurt
    databaseName: aimoneycoach
